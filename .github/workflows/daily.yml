name: ORB Trading Bot
on:
  schedule:
    - cron: '20 13 * * 1-5'   # 9:20 AM ET (adjust for daylight saving as noted before)
  workflow_dispatch:

permissions:
  contents: write             # lets the workflow save files back to the repo

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 130
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install alpaca-py
      - run: python orb_reversal.py
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
      - name: Save trade log back to repo
        run: |
          git config user.name "orb-bot"
          git config user.email "orb-bot@users.noreply.github.com"
          git add orb_trade_log.csv
          git diff --staged --quiet || git commit -m "Update trade log"
          git push
